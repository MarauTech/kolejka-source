name: Zgłoszenie błędu
description: Opisz problem w aplikacji Kolejka BETA
title: '[Błąd] '
body:
  - type: input
    id: version
    attributes:
      label: Wersja Kolejki i Androida
      placeholder: Kolejka 1.0.0-beta.2, Android 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Jak odtworzyć problem?
      description: Podaj kroki, stacje i datę kursowania, jeśli problem dotyczy danych.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Oczekiwany rezultat i faktyczne zachowanie
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: Zrzuty ekranu lub dodatkowy kontekst
      description: Usuń prywatne dane, dokładną lokalizację i wszelkie klucze.
